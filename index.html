<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a35"><title>DLPonTOP Phone Connect</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at top,#174b83,#061326 72%);color:#f3f8ff;font-family:system-ui,sans-serif}main{width:min(100%,520px)}header{text-align:center;margin-bottom:24px}.logo{display:inline-grid;place-items:center;width:68px;height:68px;border:2px solid #55cfff;border-radius:19px;box-shadow:0 0 26px #168cff66;font-weight:900;font-size:24px}h1{font-size:30px;margin:14px 0 5px}p{color:#a9bdd5;line-height:1.5}.card{background:linear-gradient(155deg,#102b4e,#091a31);border:1px solid #2b527b;border-radius:22px;padding:22px;box-shadow:0 18px 50px #0005;text-align:center}.status{margin-bottom:18px;color:#c5d7e9}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#8194a8;margin-right:8px}.good{background:#37e39a}.wait{background:#ffc65c}button{width:100%;border:0;border-radius:14px;padding:16px;color:white;font-size:16px;font-weight:750;background:linear-gradient(100deg,#0876e8,#16b5ed)}button:disabled{opacity:.55}#qrwrap{display:none;margin-top:20px}canvas{width:min(76vw,300px);height:min(76vw,300px);background:white;border-radius:12px;padding:10px}.hint{font-size:13px;text-align:center}.code{font:12px monospace;word-break:break-all;background:#07172a;padding:10px;border-radius:10px}#error{display:none;color:#ff9da4;font-size:13px}footer{text-align:center;color:#7692af;font-size:11px;margin-top:20px}
</style></head><body><main><header><div class="logo">DLP</div><h1>DLPonTOP Phone Connect</h1><p>Collega il telefono alla tua TV Samsung</p></header><section class="card"><div class="status"><span id="dot" class="dot"></span><span id="status">Pronto per il collegamento</span></div><button id="start">GENERA QR E COLLEGA LA TV</button><div id="qrwrap"><canvas id="qr" width="360" height="360"></canvas><p class="hint">Apri DLPonTOP sulla TV e inquadra il QR. Il codice scade dopo 5 minuti.</p><div id="shortcode" class="code"></div></div><p id="error"></p></section><p class="hint">Il QR contiene solo un codice temporaneo, non playlist o password IPTV.</p><footer>DARK LEGION PRODUCTION · DLPonTOP</footer></main>
<script src="./qr.js"></script><script>
(()=>{'use strict';const API='https://dlp-connect-worker.arturoragusa82.workers.dev', $=id=>document.getElementById(id);let timer=null,socket=null,expires=0;
function status(t,k=''){ $('status').textContent=t;$('dot').className='dot '+k}
function fail(t){$('error').style.display='block';$('error').textContent=t;status('Problema di collegamento');$('start').disabled=false}
async function check(id,token){try{const r=await fetch(`${API}/api/session/${id}/status`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Sessione non disponibile');if(d.tvConnected){clearInterval(timer);status('TV collegata! Apro il canale sicuro…','good');connect(id,token)}else if(Date.now()>expires){clearInterval(timer);fail('QR scaduto. Generane uno nuovo.')}else status('In attesa che la TV scansioni il QR…','wait')}catch(e){clearInterval(timer);fail(e.message)}}
function connect(id,token){if(socket&&socket.readyState<2)return;const host=new URL(API).host;socket=new WebSocket(`wss://${host}/api/session/${id}/ws?role=phone&token=${encodeURIComponent(token)}`);socket.onopen=()=>status('Telefono collegato alla sessione TV','good');socket.onmessage=e=>{try{if(JSON.parse(e.data).type==='peer_connected')status('Telefono e TV collegati!','good')}catch(_){}};socket.onclose=()=>{if(Date.now()<expires)status('Connessione interrotta','wait')}}
$('start').onclick=async()=>{clearInterval(timer);if(socket)socket.close();$('error').style.display='none';$('qrwrap').style.display='none';$('start').disabled=true;status('Creo un codice temporaneo…','wait');try{const r=await fetch(API+'/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),d=await r.json();if(!r.ok)throw Error(d.error||'Creazione sessione fallita');if(!window.QR||typeof QR.draw!=='function')throw Error('Manca qr.js: carica il generatore QR nella stessa cartella di index.html.');const payload=`${location.origin}${location.pathname}#dlp${d.sessionId}.${d.token}`;QR.draw($('qr'),payload,300);$('shortcode').textContent='Codice sessione: '+d.sessionId.slice(0,8).toUpperCase();$('qrwrap').style.display='block';expires=Date.now()+(d.expiresIn||300)*1000;status('In attesa che la TV scansioni il QR…','wait');timer=setInterval(()=>check(d.sessionId,d.token),2500);await check(d.sessionId,d.token)}catch(e){fail(e.message)}finally{$('start').disabled=false}};
})();
</script></body></html>
